name: Land map official planning scan

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    paths:
      - 'land-map/collector/**'
      - '.github/workflows/land-map-scan.yml'

permissions:
  contents: write

concurrency:
  group: land-map-official-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan official planning publications
        run: python land-map/collector/official_scan.py

      - name: Commit updated candidates
        run: |
          if git diff --quiet -- land-map/data/project-candidates.json; then
            echo "No candidate changes"
            exit 0
          fi
          git config user.name "land-map-bot"
          git config user.email "land-map-bot@users.noreply.github.com"
          git add land-map/data/project-candidates.json
          git commit -m "Land map: refresh official planning candidates"
          git push
